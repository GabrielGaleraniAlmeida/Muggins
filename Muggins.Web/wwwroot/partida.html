<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#071426">
  <title>Muggins — Sua vez</title>
  <style>
    :root {
      --blue: #338dff;
      --blue-bright: #72ccff;
      --blue-pale: #b9e8ff;
      --navy: #071426;
      --felt: #10243b;
      --white: #f3f8fd;
      --muted: #a2b4c8;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color-scheme: dark;
      color: var(--white);
    }
    * { box-sizing: border-box; }
    body { min-width: 320px; min-height: 100vh; margin: 0; background: #06101e; }
    .game-screen {
      position: relative; width: min(1720px, 100%); min-height: 100svh; display: flex; flex-direction: column; margin: 0 auto; overflow: hidden; isolation: isolate;
      background:
        radial-gradient(ellipse at 50% 43%, #a5dcff0b 0, transparent 38%),
        radial-gradient(ellipse at 8% 18%, #267cb72b 0, transparent 19%),
        radial-gradient(ellipse at 99% 53%, #175da62b 0, transparent 20%),
        repeating-linear-gradient(172deg, transparent 0 5px, #ffffff08 6px, transparent 7px 15px),
        linear-gradient(140deg, #142a45, #0e1c31 48%, #13263e);
      box-shadow: 0 0 80px #0008, inset 0 1px #b8e2ff13;
    }
    .game-screen::before { content: ""; position: absolute; z-index: -1; inset: 0; background: radial-gradient(ellipse at center, transparent 35%, #050506b3 100%); pointer-events: none; }
    .topbar { position: absolute; z-index: 5; top: 18px; left: 24px; right: 24px; display: flex; align-items: center; justify-content: space-between; }
    .back-link { display: inline-flex; align-items: center; gap: 7px; color: #c4d5e6; text-decoration: none; font-size: 11px; font-weight: 700; }
    .back-link:hover { color: #fff; }
    .back-arrow { color: var(--blue-bright); font-size: 21px; line-height: .5; }
    .match-label { color: #a2b8ce; font-size: 9px; font-weight: 750; letter-spacing: .15em; text-transform: uppercase; }
    .match-controls { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-top: 7px; }
    .match-control { min-height: 28px; padding: 0 10px; border: 1px solid #46617d; border-radius: 8px; color: #e0ecf8; background: linear-gradient(180deg, #253c57, #172b42); font: inherit; font-size: 10px; font-weight: 800; cursor: pointer; }
    .match-control.primary { border-color: #7ad0ff; background: linear-gradient(105deg, #168cf0, #1269c3); }
    .match-control:disabled { opacity: .48; cursor: not-allowed; }
    .match-tools-note { min-height: 12px; margin: 3px 0 0; color: #a2b8ce; text-align: center; font-size: 8px; }

    .opponent-zone { position: relative; z-index: 1; height: clamp(142px, 19vh, 190px); flex: 0 0 auto; }
    .opponent-card { position: absolute; top: 58px; left: clamp(22px, 5vw, 84px); min-width: 145px; display: flex; align-items: center; gap: 12px; padding: 11px 17px; border: 1px solid #78b8eb30; border-radius: 14px; background: linear-gradient(145deg, #10253eeb, #0b192be8); box-shadow: 0 9px 24px #0006, inset 0 1px #c5e8ff12; backdrop-filter: blur(14px); }
    .avatar { width: 38px; height: 38px; display: grid; place-items: center; flex: 0 0 auto; border: 1px solid #81c9ff66; border-radius: 50%; color: #e7f5ff; background: linear-gradient(145deg, #326fa2, #153758); font-size: 10px; font-weight: 850; }
    .opponent-meta small, .you-meta small { display: block; margin-bottom: 2px; color: #b6c9dc; font-size: 10px; }
    .opponent-meta strong { display: block; font-size: 24px; line-height: 1; }
    .opponent-hand { position: absolute; top: 38px; left: 50%; display: flex; gap: 12px; transform: translateX(-50%); }
    .back-tile { position: relative; isolation: isolate; width: 68px; height: 112px; border: 2px solid #d8edff; border-radius: 8px; background-color: #122943; background-image: repeating-linear-gradient(45deg, transparent 0 5px, #b9e8ff19 6px, transparent 7px 11px), repeating-linear-gradient(-45deg, transparent 0 5px, #b9e8ff13 6px, transparent 7px 11px), linear-gradient(145deg, #294968, #122943 55%, #0c2038); box-shadow: 0 1px 0 #f5fbff, 0 3px 0 #829bb2, 0 7px 12px #0009, inset 0 0 0 3px #244466, inset 1px 1px 2px #fff9; transform: perspective(520px) rotateX(5deg) rotateY(-6deg); transform-style: preserve-3d; }
    .back-tile::before { content: ""; position: absolute; z-index: -1; inset: 2px -4px -6px 2px; border: 1px solid #7f96aa; border-radius: inherit; background: linear-gradient(135deg, #aec9df, #526d85 48%, #233d58); box-shadow: 0 3px 5px #0008; transform: translateZ(-3px); }
    .back-tile::after { content: ""; position: absolute; inset: 2px; border: 1px solid #91b5d3a6; border-radius: 5px; background: linear-gradient(135deg, #ffffff27, transparent 43%, #03162a4a); pointer-events: none; }
    .timer { position: absolute; top: 45px; right: clamp(28px, 7vw, 120px); width: 104px; height: 104px; display: grid; place-items: center; border-radius: 50%; background: conic-gradient(var(--blue-bright) 0deg 166deg, #344c66 166deg 360deg); box-shadow: 0 0 20px #1a94ef3b; }
    .timer::before { content: ""; position: absolute; inset: 8px; border-radius: 50%; background: #102039; box-shadow: inset 0 0 18px #0007; }
    .timer strong { z-index: 1; font-size: 27px; font-weight: 700; }
    .timer-label { position: absolute; top: 154px; right: clamp(28px, 7vw, 120px); width: 104px; color: #a6bfd6; text-align: center; font-size: 9px; letter-spacing: .1em; text-transform: uppercase; }

    .board-zone { position: relative; z-index: 1; flex: 1 1 auto; min-height: 430px; display: flex; align-items: center; justify-content: center; }
    .ends-counter { position: absolute; z-index: 4; top: clamp(15px, 4%, 36px); right: clamp(16px, 4vw, 58px); min-width: 92px; display: grid; justify-items: end; gap: 3px; padding: 10px 13px; border: 1px solid #72bfff4d; border-radius: 12px; background: linear-gradient(145deg, #102945e8, #09182be8); box-shadow: 0 7px 18px #0005, inset 0 1px #d8efff16; }
    .ends-counter span { color: #a9c1d7; font-size: 8px; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; }
    .ends-counter strong { color: #e7f6ff; font-size: 24px; line-height: 1; font-variant-numeric: tabular-nums; text-shadow: 0 0 14px #36a8ff60; }
    .ends-counter small { color: #7fb9df; font-size: 9px; font-variant-numeric: tabular-nums; }
    .score-notice { position: absolute; z-index: 6; top: 112px; right: clamp(16px, 4vw, 58px); width: min(210px, calc(100% - 32px)); display: grid; justify-items: end; gap: 3px; padding: 10px 13px; border: 1px solid #66d99b88; border-radius: 12px; color: #f2fff8; background: linear-gradient(145deg, #123d37f2, #0a2427f2); box-shadow: 0 8px 22px #0007, 0 0 20px #45d89622, inset 0 1px #e7fff51c; text-align: right; }
    .score-notice[hidden] { display: none !important; }
    .score-notice.show { animation: score-notice-in .24s ease-out both; }
    .score-notice-label { color: #9cdec0; font-size: 8px; font-weight: 850; letter-spacing: .14em; text-transform: uppercase; }
    .score-notice strong { max-width: 100%; overflow-wrap: anywhere; font-size: 12px; }
    .score-notice-points { color: #70e5a4; font-size: 16px; font-weight: 900; font-variant-numeric: tabular-nums; }
    @keyframes score-notice-in { from { opacity: 0; transform: translateY(-7px) scale(.97); } to { opacity: 1; transform: translateY(0) scale(1); } }
    .board-chain { position: absolute; top: 50%; left: 50%; width: min(94%, 1260px); display: flex; flex-direction: column; align-items: stretch; gap: 0; transform: translate(-50%, -50%); filter: drop-shadow(0 9px 6px #000b); }
    .board-row { width: 100%; display: flex; align-items: center; justify-content: flex-start; gap: 0; }
    .board-row.reverse { flex-direction: row-reverse; }
    .domino { position: relative; isolation: isolate; display: flex; flex: 0 0 auto; overflow: visible; border: 2px solid #d7e2ed; border-radius: 7px; background: linear-gradient(145deg, #fffdf6, #d9d2c7); box-shadow: 0 1px 0 #f7fbff, 0 2px 0 #bbc5cf, 0 5px 0 #87939e, 0 10px 14px #0009, inset 0 1px 1px #fff; transform: perspective(720px) rotateX(8deg) rotateY(-2deg); transform-style: preserve-3d; }
    .domino::before { content: ""; position: absolute; z-index: -1; inset: 2px -3px -5px 2px; border: 1px solid #8997a4; border-radius: inherit; background: linear-gradient(130deg, #edf5fc, #b5c1cc 40%, #748391); box-shadow: 0 3px 5px #0007; transform: translateZ(-3px); }
    .domino::after { content: ""; position: absolute; z-index: 2; inset: 0; border-radius: inherit; background: linear-gradient(135deg, #fff8, transparent 33%, #273f5611 100%); pointer-events: none; }
    .domino.horizontal { width: 116px; height: 66px; }
    .domino.vertical { width: 66px; height: 116px; flex-direction: column; }
    .board-tile.horizontal { width: var(--board-tile-width, 116px); height: var(--board-tile-height, 66px); }
    .board-tile.vertical { width: var(--board-tile-height, 66px); height: var(--board-tile-width, 116px); }
    .board-tile.turn-connector { position: absolute; z-index: 2; }
    .board-owner { position: absolute; z-index: 3; top: -9px; right: -7px; min-width: 18px; height: 18px; display: grid; place-items: center; padding: 0 3px; border: 1px solid #eaf6ff; border-radius: 999px; color: #fff; font-size: 8px; font-weight: 900; line-height: 1; box-shadow: 0 2px 5px #0009; }
    .board-owner.bot { background: linear-gradient(135deg, #a24eeb, #6439bc); }
    .board-owner.human { background: linear-gradient(135deg, #238edc, #1459a1); }
    .half { --pip-core: var(--board-pip-core, 4.2px); --pip-halo: var(--board-pip-halo, 5.2px); position: relative; flex: 1; min-width: 0; min-height: 0; background-color: #eee8dc; background-repeat: no-repeat; box-shadow: inset 1px 1px 1px #fff9, inset -1px -1px 2px #8c847938; }
    .horizontal .half:first-child { border-radius: 5px 0 0 5px; }
    .horizontal .half:last-child { border-radius: 0 5px 5px 0; }
    .horizontal .half + .half { border-left: 1px solid #aaa197; }
    .vertical .half:first-child { border-radius: 5px 5px 0 0; }
    .vertical .half:last-child { border-radius: 0 0 5px 5px; }
    .vertical .half + .half { border-top: 1px solid #aaa197; }
    .half[data-v="0"] { background-image: none; }
    .half[data-v="1"] { background-image: radial-gradient(circle at 50% 50%, #8a7760 0, #3b3025 calc(var(--pip-core) * .34), #17120d calc(var(--pip-core) * .68), #030201 var(--pip-core), transparent var(--pip-halo)); }
    .half[data-v="2"] { background-image: radial-gradient(circle at 23% 23%, #8a7760 0, #3b3025 calc(var(--pip-core) * .34), #17120d calc(var(--pip-core) * .68), #030201 var(--pip-core), transparent var(--pip-halo)), radial-gradient(circle at 77% 77%, #8a7760 0, #3b3025 calc(var(--pip-core) * .34), #17120d calc(var(--pip-core) * .68), #030201 var(--pip-core), transparent var(--pip-halo)); }
    .half[data-v="3"] { background-image: radial-gradient(circle at 23% 23%, #8a7760 0, #3b3025 calc(var(--pip-core) * .34), #17120d calc(var(--pip-core) * .68), #030201 var(--pip-core), transparent var(--pip-halo)), radial-gradient(circle at 50% 50%, #8a7760 0, #3b3025 calc(var(--pip-core) * .34), #17120d calc(var(--pip-core) * .68), #030201 var(--pip-core), transparent var(--pip-halo)), radial-gradient(circle at 77% 77%, #8a7760 0, #3b3025 calc(var(--pip-core) * .34), #17120d calc(var(--pip-core) * .68), #030201 var(--pip-core), transparent var(--pip-halo)); }
    .half[data-v="4"] { background-image: radial-gradient(circle at 23% 23%, #8a7760 0, #3b3025 calc(var(--pip-core) * .34), #17120d calc(var(--pip-core) * .68), #030201 var(--pip-core), transparent var(--pip-halo)), radial-gradient(circle at 77% 23%, #8a7760 0, #3b3025 calc(var(--pip-core) * .34), #17120d calc(var(--pip-core) * .68), #030201 var(--pip-core), transparent var(--pip-halo)), radial-gradient(circle at 23% 77%, #8a7760 0, #3b3025 calc(var(--pip-core) * .34), #17120d calc(var(--pip-core) * .68), #030201 var(--pip-core), transparent var(--pip-halo)), radial-gradient(circle at 77% 77%, #8a7760 0, #3b3025 calc(var(--pip-core) * .34), #17120d calc(var(--pip-core) * .68), #030201 var(--pip-core), transparent var(--pip-halo)); }
    .half[data-v="5"] { background-image: radial-gradient(circle at 23% 23%, #8a7760 0, #3b3025 calc(var(--pip-core) * .34), #17120d calc(var(--pip-core) * .68), #030201 var(--pip-core), transparent var(--pip-halo)), radial-gradient(circle at 77% 23%, #8a7760 0, #3b3025 calc(var(--pip-core) * .34), #17120d calc(var(--pip-core) * .68), #030201 var(--pip-core), transparent var(--pip-halo)), radial-gradient(circle at 50% 50%, #8a7760 0, #3b3025 calc(var(--pip-core) * .34), #17120d calc(var(--pip-core) * .68), #030201 var(--pip-core), transparent var(--pip-halo)), radial-gradient(circle at 23% 77%, #8a7760 0, #3b3025 calc(var(--pip-core) * .34), #17120d calc(var(--pip-core) * .68), #030201 var(--pip-core), transparent var(--pip-halo)), radial-gradient(circle at 77% 77%, #8a7760 0, #3b3025 calc(var(--pip-core) * .34), #17120d calc(var(--pip-core) * .68), #030201 var(--pip-core), transparent var(--pip-halo)); }
    .half[data-v="6"] { background-image: radial-gradient(circle at 20% 27%, #8a7760 0, #3b3025 calc(var(--pip-core) * .34), #17120d calc(var(--pip-core) * .68), #030201 var(--pip-core), transparent var(--pip-halo)), radial-gradient(circle at 50% 27%, #8a7760 0, #3b3025 calc(var(--pip-core) * .34), #17120d calc(var(--pip-core) * .68), #030201 var(--pip-core), transparent var(--pip-halo)), radial-gradient(circle at 80% 27%, #8a7760 0, #3b3025 calc(var(--pip-core) * .34), #17120d calc(var(--pip-core) * .68), #030201 var(--pip-core), transparent var(--pip-halo)), radial-gradient(circle at 20% 73%, #8a7760 0, #3b3025 calc(var(--pip-core) * .34), #17120d calc(var(--pip-core) * .68), #030201 var(--pip-core), transparent var(--pip-halo)), radial-gradient(circle at 50% 73%, #8a7760 0, #3b3025 calc(var(--pip-core) * .34), #17120d calc(var(--pip-core) * .68), #030201 var(--pip-core), transparent var(--pip-halo)), radial-gradient(circle at 80% 73%, #8a7760 0, #3b3025 calc(var(--pip-core) * .34), #17120d calc(var(--pip-core) * .68), #030201 var(--pip-core), transparent var(--pip-halo)); }
    .vertical .half[data-v="6"] { background-image: radial-gradient(circle at 27% 20%, #8a7760 0, #3b3025 calc(var(--pip-core) * .34), #17120d calc(var(--pip-core) * .68), #030201 var(--pip-core), transparent var(--pip-halo)), radial-gradient(circle at 73% 20%, #8a7760 0, #3b3025 calc(var(--pip-core) * .34), #17120d calc(var(--pip-core) * .68), #030201 var(--pip-core), transparent var(--pip-halo)), radial-gradient(circle at 27% 50%, #8a7760 0, #3b3025 calc(var(--pip-core) * .34), #17120d calc(var(--pip-core) * .68), #030201 var(--pip-core), transparent var(--pip-halo)), radial-gradient(circle at 73% 50%, #8a7760 0, #3b3025 calc(var(--pip-core) * .34), #17120d calc(var(--pip-core) * .68), #030201 var(--pip-core), transparent var(--pip-halo)), radial-gradient(circle at 27% 80%, #8a7760 0, #3b3025 calc(var(--pip-core) * .34), #17120d calc(var(--pip-core) * .68), #030201 var(--pip-core), transparent var(--pip-halo)), radial-gradient(circle at 73% 80%, #8a7760 0, #3b3025 calc(var(--pip-core) * .34), #17120d calc(var(--pip-core) * .68), #030201 var(--pip-core), transparent var(--pip-halo)); }
    .highlight { border-color: #79d1ff; box-shadow: 0 0 11px #2da7ff, 0 0 24px #168cff88, inset 0 0 5px #fff; }
    .turn-indicator { position: absolute; bottom: 5%; left: 50%; min-width: 195px; padding: 12px 30px; border: 1px solid #a5e2ff; border-radius: 999px; color: white; background: linear-gradient(100deg, #168cf0, #125fbd); box-shadow: 0 0 16px #268fffc4, 0 0 40px #168cff55, inset 0 1px #ffffff5e; text-align: center; font-size: 18px; font-weight: 800; transform: translateX(-50%); }

    .player-zone { position: relative; z-index: 2; min-height: 177px; flex: 0 0 auto; display: grid; grid-template-columns: 164px minmax(0, 1fr) 160px; align-items: center; gap: 22px; padding: 17px clamp(22px, 4.5vw, 78px) 21px; border-top: 1px solid #89caff30; background: linear-gradient(180deg, #0d2037f2, #071426fa); box-shadow: 0 -14px 35px #0007, inset 0 1px #d1ecff0b; }
    .you-card { min-height: 115px; display: flex; align-items: center; gap: 10px; padding: 11px; border: 1px solid #77bdf02b; border-radius: 15px; background: linear-gradient(145deg, #112944d9, #09182ad9); box-shadow: inset 0 1px #e0f3ff12; }
    .you-card .avatar { width: 40px; height: 40px; border-color: #72ccff; background: linear-gradient(145deg, #2587d1, #154471); box-shadow: 0 0 14px #168cff55; }
    .you-meta strong { font-size: 25px; line-height: 1; }
    .player-hand { min-width: 0; display: flex; align-items: center; justify-content: center; gap: clamp(5px, 1vw, 15px); }
    .player-hand .domino { width: clamp(44px, 4.2vw, 62px); height: 108px; flex-direction: column; }
    .player-hand .half { background-size: 100% 100%; }
    .player-hand .hand-tile { padding: 0; cursor: pointer; }
    .player-hand .hand-tile:focus-visible { outline: 3px solid #a6e2ff; outline-offset: 3px; }
    .player-hand .hand-tile.selected { border-color: #7ad0ff; box-shadow: 0 0 0 3px #168cff88, 0 0 24px #168cffb0, 0 5px 0 #87939e; transform: translateY(-9px) perspective(720px) rotateX(8deg) rotateY(-2deg); }
    .actions { grid-template-columns: 1fr 1fr; }
    .action { padding: 0 7px; cursor: pointer; }
    .action:disabled { opacity: .48; cursor: not-allowed; }
    .action.target-action { border-color: #72ccff; color: #fff; background: linear-gradient(105deg, #168cf0, #1269c3); }
    .game-message { position: fixed; z-index: 10; top: 62px; left: 50%; width: min(560px, calc(100% - 28px)); padding: 12px 16px; border: 1px solid #47749a; border-radius: 12px; color: #e7f5ff; background: #0b1c30f2; box-shadow: 0 12px 35px #0009; text-align: center; font-size: 12px; transform: translateX(-50%); }
    .game-message[hidden] { display: none; }
    .selected-caption { min-height: 14px; margin: 3px 0 0; color: #a6dfff; text-align: center; font-size: 9px; }
    .actions { display: grid; gap: 10px; }
    .action { min-height: 50px; border: 1px solid #46617d; border-radius: 12px; color: #e0ecf8; background: linear-gradient(180deg, #253c57, #172b42); font: inherit; font-size: 14px; font-weight: 800; box-shadow: inset 0 1px #ffffff14; }
    .action.primary { border-color: #7ad0ff; color: #fff; background: linear-gradient(105deg, #168cf0, #1269c3); box-shadow: 0 7px 20px #087de755, inset 0 1px #d7f2ff55; }
    .action:disabled { cursor: default; opacity: .93; }
    @media (max-width: 1050px) {
      .opponent-hand { gap: 8px; }
      .back-tile { width: 55px; height: 91px; }
      .timer { width: 86px; height: 86px; }
      .timer-label { top: 139px; width: 86px; }
      .player-zone { grid-template-columns: 125px minmax(0, 1fr) 128px; gap: 12px; padding-right: 25px; padding-left: 25px; }
      .you-card { padding: 8px; }
      .you-card .avatar { width: 33px; height: 33px; }
      .player-hand .domino { width: clamp(36px, 4.8vw, 50px); height: 88px; }
      .action { min-height: 44px; }
    }
    @media (max-width: 700px) {
      .topbar { top: 11px; left: 13px; right: 13px; gap: 8px; }
      .match-label { font-size: 8px; }
      .match-controls { gap: 4px; margin-top: 5px; }
      .match-control { min-height: 25px; padding: 0 7px; border-radius: 6px; font-size: 9px; }
      .match-tools-note { font-size: 7px; }
      .opponent-zone { height: 133px; }
      .opponent-card { top: 42px; left: 14px; min-width: 112px; gap: 7px; padding: 8px; }
      .opponent-card .avatar { width: 30px; height: 30px; }
      .opponent-meta small, .you-meta small { font-size: 8px; }
      .opponent-meta strong { font-size: 20px; }
      .piece-caption { display: none; }
      .opponent-hand { top: 48px; left: calc(50% + 37px); gap: 4px; }
      .opponent-hand .back-tile:nth-child(n+6) { display: none; }
      .back-tile { width: 27px; height: 49px; border-width: 1px; border-radius: 5px; box-shadow: 0 1px 0 #f5fbff, 0 2px 0 #829bb2, 0 5px 8px #0008, inset 0 0 0 2px #244466, inset 1px 1px 2px #fff9; }
      .timer { top: 45px; right: 14px; width: 63px; height: 63px; }
      .timer::before { inset: 5px; }
      .timer strong { font-size: 19px; }
      .timer-label { top: 111px; right: 14px; width: 63px; font-size: 7px; }
      .board-zone { min-height: 380px; overflow: hidden; }
      .ends-counter { top: 12px; right: 12px; min-width: 68px; gap: 2px; padding: 7px 9px; border-radius: 9px; }
      .ends-counter span { font-size: 7px; }
      .ends-counter strong { font-size: 19px; }
      .ends-counter small { font-size: 8px; }
      .score-notice { top: 92px; right: 12px; width: min(155px, calc(100% - 24px)); gap: 2px; padding: 7px 9px; border-radius: 9px; }
      .score-notice-label { font-size: 6px; }
      .score-notice strong { font-size: 9px; }
      .score-notice-points { font-size: 13px; }
      .turn-indicator { bottom: 4%; min-width: 155px; padding: 10px 20px; font-size: 15px; }
      .player-zone { min-height: 190px; grid-template-columns: 1fr auto; gap: 8px; padding: 12px 12px 17px; }
      .you-card { grid-column: 1; grid-row: 1; min-height: 46px; border: 0; padding: 0; background: none; }

      <img class="table-glass table-glass-left" src="/images/whisky-tumbler-top.webp" alt="" aria-hidden="true">
      <img class="table-glass table-glass-right" src="/images/whisky-tumbler-top.webp" alt="" aria-hidden="true">
      <div class="ends-counter" aria-label="Soma das quinas">
        <span>Quinas</span>
        <strong id="ends-total">0</strong>
        <small id="ends-values">0 + 0</small>
      </div>
      <div class="score-notice" id="score-notice" role="status" aria-live="polite" hidden>
        <span class="score-notice-label">Ponto marcado</span>
        <strong id="score-notice-player"></strong>
        <span class="score-notice-points" id="score-notice-points"></span>
      </div>
      <div class="board-chain" id="board-chain" aria-label="Peças jogadas no tabuleiro" aria-live="polite"></div>
      <div class="turn-indicator" id="turn-indicator">Conectando…</div>
    </section>

    <section class="player-zone" aria-label="Sua mão e ações disponíveis">
      <div class="you-card">
        <div class="avatar" aria-hidden="true">EU</div>
        <div class="you-meta"><strong id="human-name">Você</strong><small><span id="human-score">0</span> pts</small><span class="piece-caption"><span id="human-count">—</span> peças restantes</span></div>
      </div>
      <div class="player-hand" id="player-hand" aria-label="Sua mão e ações disponíveis"></div>
      <div class="player-controls">
        <div class="actions" aria-label="Ações da partida">
          <button class="action" id="play-left" type="button" disabled>← Esquerda</button>
          <button class="action" id="play-right" type="button" disabled>Direita →</button>
          <button class="action primary" id="buy" type="button" disabled>Comprar</button>
          <button class="action" id="pass" type="button" disabled>Passar</button>
        </div>
        <div class="match-controls" aria-label="Controles da partida">
          <button class="match-control" id="finish-match" type="button" disabled title="A API não oferece desistência manual.">Encerrar</button>
          <button class="match-control primary" id="restart-match" type="button" disabled title="Disponível quando a partida terminar.">Reiniciar</button>
        </div>
        <p class="match-tools-note" id="match-controls-note">Encerramento depende das regras da API</p>
        <p class="selected-caption" id="selected-caption" aria-live="polite"></p>
      </div>
    </section>
  </main>
  <div class="game-message" id="game-message" role="status" aria-live="polite" hidden></div>
